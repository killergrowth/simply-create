<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simply Create KC | Coming Soon</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #fff;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: min(420px, 85vw);
      height: auto;
      display: block;
      margin: 0 auto 2rem;
    }
    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #555;
      font-style: italic;
      letter-spacing: 0.02em;
      max-width: 480px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/images/logo.png" alt="Simply Create KC Logo" class="logo">
    <p class="tagline">Simply Create KC</p>
  </div>
</body>
</html>
