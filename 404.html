<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Simply Create KC</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:3rem 2rem;">
    <img src="/images/logo.png" alt="Simply Create KC" style="height:48px; margin-bottom:2.5rem;">
    <p style="font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--terracotta); margin-bottom:0.75rem;">404</p>
    <h1 style="font-family:var(--font-serif); margin-bottom:1rem;">Page not found.</h1>
    <p style="color:var(--mid-gray); margin-bottom:2rem;">That page doesn't exist — but the studio does. Let's get you back.</p>
    <div style="display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;">
      <a href="/" class="btn btn-dark">Go Home</a>
      <a href="/classes/" class="btn btn-outline">Browse Classes</a>
    </div>
  </div>
  <script>document.querySelectorAll('.btn').forEach(function(b){b.style.display='inline-block';});</script>
</body>
</html>
